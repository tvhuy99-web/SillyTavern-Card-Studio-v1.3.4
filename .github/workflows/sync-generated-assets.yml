name: Sync generated Card Studio assets (one-time)

on:
  push:
    branches:
      - feat/android-apk-github-actions

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-apk-github-actions
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build generated runtime files
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit generated runtime sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m 'build: sync generated assets for AI Studio fourth provider'
            git push origin HEAD:feat/android-apk-github-actions
          fi
