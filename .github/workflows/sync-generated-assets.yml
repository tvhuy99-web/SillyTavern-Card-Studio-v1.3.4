name: One-time sync compact provider UI
on:
  push:
    branches: [feat/android-apk-github-actions]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-apk-github-actions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and rebuild compact provider UI
        run: |
          npm install --no-audit --no-fund
          node tests/ai-studio-live-turns.mjs
          npm run build
      - name: Save generated web assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m 'build: sync four-provider dropdown and clean AI Studio settings'
            git push origin HEAD:feat/android-apk-github-actions
          fi
