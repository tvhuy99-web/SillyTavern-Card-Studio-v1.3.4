name: One-time sync Android AI Studio session assets

on:
  push:
    branches: [feat/android-apk-github-actions]

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-apk-github-actions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build web and sync generated sources
        run: |
          npm install --no-audit --no-fund
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m 'build: sync AI Studio automatic session and extended watchdog'
            git push origin HEAD:feat/android-apk-github-actions
          fi
