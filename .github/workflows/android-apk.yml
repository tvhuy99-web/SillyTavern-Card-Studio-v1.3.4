name: Android APK (debug)

# Use "Run workflow" on GitHub Actions after this file is merged to main.
# Pull requests and main-branch pushes also build automatically.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK (API 36)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable static web app
        run: |
          npm run build
          test -s dist/index.html
          test -d dist/assets

      # Keep the existing web project untouched: only build-time CI installs.
      - name: Install Capacitor 8
        run: npm install --no-save --no-audit --no-fund @capacitor/core@8 @capacitor/android@8 @capacitor/cli@8

      - name: Configure Android app
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.tvhuy99.cardstudio",
            "appName": "SillyTavern Card Studio",
            "webDir": "dist"
          }
          JSON

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SillyTavern-Card-Studio-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
