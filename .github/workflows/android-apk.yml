name: Android APK (debug)

# Use "Run workflow" on GitHub Actions after this file is merged to main.
# Pull requests and main-branch pushes also build automatically.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub-hosted Ubuntu already provides Android SDK and sdkmanager.
      # Avoid setup-android@v3: it currently requests a removed "tools" package.
      - name: Install Android 16 SDK (API 36)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Test AI Studio response selectors and streaming
        run: |
          node tests/ai-studio-response-extractor.mjs
          node tests/ai-studio-live-turns.mjs
          node tests/ai-studio-background.mjs
          node tests/m4-native-embedding-bridge.mjs
          node tests/m4-embeddinggemma2-litert-bridge.mjs
          node tests/android-export-download.mjs

      - name: Build portable static web app
        run: |
          npm run build
          test -s dist/index.html
          test -d dist/assets

      # Keep the existing web project untouched: only build-time CI installs.
      - name: Install Capacitor 8
        run: npm install --no-save --no-audit --no-fund @capacitor/core@8 @capacitor/android@8 @capacitor/cli@8

      - name: Configure Android app
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.tvhuy99.cardstudio",
            "appName": "SillyTavern Card Studio",
            "webDir": "dist"
          }
          JSON

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Register Android AI Studio and native World Info ONNX plugins
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_DIR="android/app/src/main/java/com/tvhuy99/cardstudio"
          mkdir -p "$PLUGIN_DIR"
          cp android-native/AiStudioTextPlugin.java "$PLUGIN_DIR/AiStudioTextPlugin.java"
          cp android-native/AiStudioGenerationService.java "$PLUGIN_DIR/AiStudioGenerationService.java"
          cp android-native/WorldInfoEmbeddingNativePlugin.java "$PLUGIN_DIR/WorldInfoEmbeddingNativePlugin.java"
          cp android-native/EmbeddingGemma2LiteRTPlugin.java "$PLUGIN_DIR/EmbeddingGemma2LiteRTPlugin.java"
          cp android-native/AndroidExportFilePlugin.java "$PLUGIN_DIR/AndroidExportFilePlugin.java"
          cat > "$PLUGIN_DIR/MainActivity.java" <<'JAVA'
          package com.tvhuy99.cardstudio;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AiStudioTextPlugin.class);
                  registerPlugin(WorldInfoEmbeddingNativePlugin.class);
                  registerPlugin(EmbeddingGemma2LiteRTPlugin.class);
                  registerPlugin(AndroidExportFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_DATA_SYNC",
              "android.permission.WAKE_LOCK",
              "android.permission.POST_NOTIFICATIONS",
          ]
          for permission in permissions:
              line = f'<uses-permission android:name="{permission}" />'
              if line not in text:
                  text = text.replace("<application", f"    {line}\n    <application", 1)
          service = (
              '<service android:name=".AiStudioGenerationService" '
              'android:exported="false" android:stopWithTask="false" '
              'android:foregroundServiceType="dataSync" />'
          )
          if service not in text:
              text = text.replace("</application>", f"    {service}\n    </application>", 1)
          # LiteRT-LM requires optional vendor OpenCL libraries to be
          # visible on Android 12+. CPU-only phones must still install.
          for lib in ("libOpenCL.so", "libvndksupport.so"):
              declaration = f'<uses-native-library android:name="{lib}" android:required="false" />'
              if declaration not in text:
                  text = text.replace("</application>", f"    {declaration}\n    </application>", 1)
          manifest.write_text(text)
          PY

      # Stable debug key copied from GeminiLiveTranslate. This is a PUBLIC
      # DEBUG key, not a release signing key. Do NOT use for production releases.
      - name: Add ARM64-only Android-native ONNX Runtime and LiteRT-LM
        shell: bash
        run: |
          set -euo pipefail
          cat >> android/app/build.gradle <<'GRADLE'
          // Package native libraries only for 64-bit ARM devices.
          android {
              defaultConfig {
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }
          }
          dependencies {
              implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
              implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.0'
          }
          GRADLE
          test -s android-native/WorldInfoEmbeddingNativePlugin.java

      - name: Configure stable debug signature and monotonic version
        shell: bash
        run: |
          set -euo pipefail
          echo "STABLE_DEBUG_KEYSTORE=$RUNNER_TEMP/cardstudio-stable-debug.jks" >> "$GITHUB_ENV"
          base64 --decode .github/signing/stable-debug.keystore.b64 > "$RUNNER_TEMP/cardstudio-stable-debug.jks"
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  stableDebug {
                      storeFile file(System.getenv('STABLE_DEBUG_KEYSTORE'))
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                      enableV1Signing true
                      enableV2Signing true
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableDebug
                  }
              }
              defaultConfig {
                  versionCode 10000 + Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
                  versionName "1.3.6." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
              }
          }
          GRADLE

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK only contains ARM64 native libraries
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path

          apk = Path('android/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file() and apk.stat().st_size, 'APK missing or empty'
          with ZipFile(apk) as bundle:
              files = set(bundle.namelist())
              libraries = sorted(name for name in files if name.startswith('lib/') and name.endswith('.so'))
              abis = {name.split('/')[1] for name in libraries}
              assert abis == {'arm64-v8a'}, f'Unexpected native ABI(s): {sorted(abis)}'
              required = {
                  'lib/arm64-v8a/libonnxruntime.so',
                  'lib/arm64-v8a/libonnxruntime4j_jni.so',
                  'lib/arm64-v8a/liblitertlm_jni.so',
              }
              missing = required - files
              assert not missing, f'Native model runtime missing: {sorted(missing)}'
              for library in libraries:
                  print(library)
          print('ARM64-only ONNX Runtime + LiteRT-LM packaging verified.')
          PY
          grep -q 'EmbeddingGemma2LiteRTPlugin' android/app/src/main/java/com/tvhuy99/cardstudio/MainActivity.java

      - name: Verify stable signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner-output.txt"
          EXPECTED="85e27156c4557de4f35b6ebe771dd426f108182894219ff3b6dbed607a230c95"
          ACTUAL="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apksigner-output.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SillyTavern-Card-Studio-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
