name: Bundle regression checks

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'build/**'
      - 'tools/**'
      - 'scripts/**'
      - 'android-native/**'
      - '_headers'
      - '_redirects'
      - 'api-unavailable.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
      - 'version.json'
      - '.github/workflows/bundle-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build portable static app
        run: npm run build:portable
      - name: Verify all generated assets are committed
        run: |
          git diff --exit-code -- assets
          test -z "$(git ls-files --others --exclude-standard -- assets)"
      - name: Verify retained vendor integrity
        run: npm run verify:vendor
      - name: Run all regression tests
        run: npm test
      - name: Build direct source ESM deployment
        run: npm run build:source && npm run test:source-bootstrap
      - name: Ensure source build did not modify portable assets
        run: git diff --exit-code -- assets

  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:native-java
      - run: npm run test:android-overlay

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build portable static app
        run: npm run build:portable
      - name: Check Chromium/Chrome availability
        run: google-chrome --version
      - name: Browser application acceptance
        env:
          CHROME_BIN: google-chrome
        run: npm run test:app-browser
      - name: Browser IndexedDB migration and transaction acceptance
        env:
          CHROME_BIN: google-chrome
        run: npm run test:storage-browser
      - name: Build direct source deployment
        run: npm run build:source
      - name: Browser direct-source application and IndexedDB acceptance
        env:
          APP_DIST: dist-source
          CHROME_BIN: google-chrome
        run: npm run test:app-browser && npm run test:storage-browser

  # Extra manual repeat of the mandatory locked npm gate in phase1-quality-gates.yml.
  npm-runtime-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated runtime dependencies
        run: |
          npm ci --prefix build/npm-runtime --no-audit --no-fund
          git diff --exit-code -- build/npm-runtime/package-lock.json
          npm ls --prefix build/npm-runtime --all
      - name: Record actual registry lock and installed license metadata
        run: node tools/audit-npm-dependencies.mjs > npm-dependency-evidence.json
      - name: Upload dependency evidence for review
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-evidence
          path: |
            build/npm-runtime/package-lock.json
            npm-dependency-evidence.json
          if-no-files-found: error
      - name: Build package-backed runtime
        run: npm run build:npm
      - name: Test actual package runtime
        run: npm run test:npm-runtime
      - name: Bootstrap package-backed application graph
        env:
          APP_DIST: dist-npm
        run: npm run test:source-bootstrap
      - name: Verify portable assets unchanged
        run: git diff --exit-code -- assets
      - name: Browser acceptance for package runtime
        env:
          APP_DIST: dist-npm
          CHROME_BIN: google-chrome
        run: npm run test:app-browser
      - name: Package-backed IndexedDB acceptance
        env:
          APP_DIST: dist-npm
          CHROME_BIN: google-chrome
        run: npm run test:storage-browser
