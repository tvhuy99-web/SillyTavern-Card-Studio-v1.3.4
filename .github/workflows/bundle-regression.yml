name: Bundle regression checks

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'build/**'
      - 'src/**'
      - 'patch-src/**'
      - 'index.html'
      - 'package.json'
      - 'version.json'
      - '.github/workflows/bundle-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-transforms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static production bundle
        run: node build/build-production-bundle.mjs
      - name: Verify generated production bundle is committed
        run: git diff --exit-code -- assets/app-production-v1.3.6.js
      - name: Test Arena bundle transform
        run: node patch-src/test-arena-state-bundle-transform-v1.3.6.4.mjs
      - name: Test core reliability bundle transform
        run: node patch-src/test-core-reliability-bundle-transform-v1.3.6.4.mjs
