name: Bundle regression checks

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'build/**'
      - 'src/**'
      - 'tests/**'
      - 'patch-src/**'
      - 'index.html'
      - 'package.json'
      - 'version.json'
      - '.github/workflows/bundle-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-transforms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static production bundle and runtime assets
        run: node build/build-production-bundle.mjs
      - name: Verify generated assets are committed
        run: |
          git diff --exit-code -- assets/app-production-v1.3.6.js
          git diff --exit-code -- assets/prompt-normalizer-v1.3.6.js
          git diff --exit-code -- assets/proxy-persistence-service-v1.3.6.js
          git diff --exit-code -- assets/card-runtime-core-builder-v1.3.6.js
          git diff --exit-code -- assets/card-runtime-renderer-v1.3.6.js
          git diff --exit-code -- assets/m4
          git diff --exit-code -- assets/m5
      - name: Parse generated runtime modules
        run: |
          node --check assets/app-entry-v1.3.6.js
          node --check assets/app-production-v1.3.6.js
          node --check assets/prompt-normalizer-v1.3.6.js
          node --check assets/proxy-persistence-service-v1.3.6.js
          node --check assets/card-runtime-core-builder-v1.3.6.js
          node --check assets/card-runtime-renderer-v1.3.6.js
          node --check assets/m4/providers/common/generation-utils.js
          node --check assets/m4/providers/common/generation-gateway.js
          node --check assets/m4/providers/proxy/generation.js
          node --check assets/m4/providers/openrouter/generation.js
          node --check assets/m4/providers/gemini/generation.js
          node --check assets/m4/features/chat/turn-policy.js
          node --check assets/m4/features/chat/conversation-service.js
          node --check assets/m4/features/world-info/smart-scan-service.js
          node --check assets/m4/features/prompts/prompt-service.js
          node --check assets/m4/features/chat/response-processor.js
          node --check assets/m5/app/state/runtime-state.js
          node --check assets/m5/app/persistence/session-state.js
          node --check assets/m5/diagnostics/state.js
          node --check assets/m5/features/arena/state-machine.js
          node --check assets/m5/ui/runtime-guard.js
      - name: Test M2/M3 architecture boundaries
        run: node tests/architecture-m2-m3.mjs
      - name: Test M4 architecture boundaries
        run: node tests/architecture-m4.mjs
      - name: Test M4 generation gateway
        run: node tests/m4-generation-gateway.mjs
      - name: Test M4 chat turn policy
        run: node tests/m4-chat-turn-policy.mjs
      - name: Test M4 conversation service
        run: node tests/m4-conversation-service.mjs
      - name: Test M4 Smart Scan service
        run: node tests/m4-smart-scan-service.mjs
      - name: Test M4 prompt service
        run: node tests/m4-prompt-service.mjs
      - name: Test M4 response processor
        run: node tests/m4-response-processor.mjs
      - name: Test M5 architecture boundaries
        run: node tests/architecture-m5.mjs
      - name: Test M5 state and persistence
        run: node tests/m5-state-persistence.mjs
      - name: Test M5 Arena state machine
        run: node tests/m5-arena-state.mjs
      - name: Test scoped preset normalizer
        run: node tests/prompt-normalizer.mjs
      - name: Test owned proxy persistence
        run: node tests/proxy-persistence.mjs
      - name: Test Card Runtime extraction
        run: node tests/card-runtime-extraction.mjs
      - name: Test Arena bundle transform
        run: node patch-src/test-arena-state-bundle-transform-v1.3.6.4.mjs
      - name: Test core reliability bundle transform
        run: node patch-src/test-core-reliability-bundle-transform-v1.3.6.4.mjs
